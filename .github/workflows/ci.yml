name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr

      - name: Configure
        run: cmake -S test -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check coverage (100 % lines and branches of src/)
        run: |
          mkdir -p coverage
          gcovr --root . --filter src/ --exclude-throw-branches \
            --fail-under-line 100 --fail-under-branch 100 \
            --print-summary --txt coverage/coverage.txt --html-details coverage/index.html \
            build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The library is not (yet) registered in the Arduino library manager,
      # so it is checked against the rules for a new submission. "strict"
      # compliance would require renaming the library ("STS3X Library" contains
      # a space and the word "library", rules LP015 and LP016).
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit
          compliance: specification

  compile-examples:
    name: Compile examples (${{ matrix.board.fqbn }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
          - fqbn: arduino:samd:mkrzero
            platforms: |
              - name: arduino:samd
          - fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
